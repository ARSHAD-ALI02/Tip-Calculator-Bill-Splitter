<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Live tip calculator and bill splitter">
  <title>Tip Calculator & Bill Splitter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --app-primary: #0d9488;
      --app-primary-dark: #0f766e;
      --app-primary-light: #ccfbf1;
      --app-accent: #f59e0b;
      --app-accent-soft: #fef3c7;
      --app-surface: #f0fdfa;
      --app-card: #ffffff;
      --app-text: #134e4a;
      --app-text-body: #334155;
      --app-muted: #64748b;
      --app-border: #e2e8f0;
      --app-danger: #e11d48;
      --app-danger-bg: #fff1f2;
      --app-radius: 1.25rem;
      --app-radius-sm: 0.875rem;
      --app-shadow: 0 8px 32px rgba(15, 118, 110, 0.1);
      --app-shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
      --touch-min: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--app-text-body);
      min-height: 100dvh;
      margin: 0;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem);
      background: #ecfeff;
      overflow-x: clip;
      overflow-y: auto;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }
    .bg-blob-1 {
      width: 280px; height: 280px;
      background: rgba(45, 212, 191, 0.45);
      top: -80px; right: -60px;
    }
    .bg-blob-2 {
      width: 220px; height: 220px;
      background: rgba(251, 191, 36, 0.35);
      bottom: 20%; left: -80px;
    }
    .bg-blob-3 {
      width: 180px; height: 180px;
      background: rgba(13, 148, 136, 0.25);
      bottom: -40px; right: 10%;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      min-width: 0;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
    }

    #calculator-form,
    .card-app,
    .results-panel {
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .app-header {
      text-align: center;
      padding: 0.5rem 0 1.25rem;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--app-primary) 0%, #2dd4bf 100%);
      color: #fff;
      border-radius: 18px;
      font-size: 1.5rem;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.35);
    }

    .app-header h1 {
      font-size: clamp(1.5rem, 5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--app-text);
      margin: 0 0 0.35rem;
    }

    .app-header p {
      color: var(--app-muted);
      font-size: 0.9375rem;
      margin: 0;
      line-height: 1.45;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 0.65rem;
      padding: 0.3rem 0.75rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--app-primary-dark);
      background: var(--app-primary-light);
      border-radius: 999px;
    }
    .badge-live::before {
      content: "";
      width: 6px; height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse-dot 1.5s ease infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .card-app {
      background: var(--app-card);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--app-radius);
      box-shadow: var(--app-shadow);
      backdrop-filter: blur(8px);
    }

    .field-block {
      margin-bottom: 1.35rem;
    }
    .field-block:last-of-type { margin-bottom: 1rem; }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0;
      min-width: 0;
    }
    fieldset legend {
      float: left;
      width: 100%;
    }
    fieldset legend + * { clear: both; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--app-text);
      margin-bottom: 0.55rem;
    }
    .section-label i {
      font-size: 1rem;
      color: var(--app-primary);
      opacity: 0.9;
    }

    .input-group {
      min-width: 0;
      max-width: 100%;
    }
    .input-group > .form-control {
      min-width: 0;
      flex: 1 1 auto;
      width: 1%;
    }

    .input-group-currency {
      border-radius: var(--app-radius-sm);
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      max-width: 100%;
    }
    .input-group-currency .input-group-text {
      font-weight: 700;
      font-size: 1.125rem;
      background: var(--app-surface);
      border: 2px solid var(--app-border);
      border-right: none;
      color: var(--app-primary-dark);
      min-width: 3.25rem;
      justify-content: center;
      padding: 0 1rem;
    }
    .input-group-currency .form-control {
      border: 2px solid var(--app-border);
      border-left: none;
      font-size: 1.375rem;
      font-weight: 700;
      color: var(--app-text);
      min-height: var(--touch-min);
      padding: 0.65rem 1rem;
      background: #fff;
    }
    .input-group-currency .form-control::placeholder {
      color: #cbd5e1;
      font-weight: 500;
    }

    .form-control-lg-plain {
      min-height: var(--touch-min);
      font-size: 1.25rem;
      font-weight: 700;
      border: 2px solid var(--app-border);
      border-radius: var(--app-radius-sm);
      padding: 0.65rem 1rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus,
    .btn-tip:focus-visible,
    .btn-step:focus-visible,
    .btn-reset:focus-visible {
      border-color: var(--app-primary);
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.18);
      outline: none;
    }

    .form-control.is-invalid {
      border-color: var(--app-danger);
      background-color: var(--app-danger-bg);
      background-image: none;
    }

    .invalid-feedback {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      min-height: 1.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--app-danger);
      margin-top: 0.4rem;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .invalid-feedback.visible { opacity: 1; transform: translateY(0); }

    .tip-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    @media (max-width: 380px) {
      .tip-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .btn-tip {
      min-height: var(--touch-min);
      font-weight: 700;
      font-size: 0.9375rem;
      border: 2px solid var(--app-border);
      border-radius: var(--app-radius-sm);
      background: #fff;
      color: var(--app-text-body);
      padding: 0.5rem 0.4rem;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.12s, box-shadow 0.2s;
    }
    .btn-tip:hover:not(.active) {
      border-color: var(--app-primary);
      color: var(--app-primary-dark);
      background: var(--app-surface);
    }
    .btn-tip.active {
      border-color: transparent;
      background: linear-gradient(145deg, var(--app-primary) 0%, #14b8a6 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4);
    }
    .btn-tip:active { transform: scale(0.96); }

    .tip-custom-wrap {
      margin-top: 0.65rem;
      padding: 0.85rem;
      background: var(--app-surface);
      border-radius: var(--app-radius-sm);
      border: 1px dashed rgba(13, 148, 136, 0.25);
      animation: fade-in 0.25s ease;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .tip-custom-wrap .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--app-muted);
      margin-bottom: 0.35rem;
    }
    .tip-custom-wrap .input-group-text {
      font-weight: 700;
      background: #fff;
      border: 2px solid var(--app-border);
      border-left: none;
      color: var(--app-primary-dark);
    }
    .tip-custom-wrap .form-control {
      border: 2px solid var(--app-border);
      border-right: none;
      font-weight: 700;
      min-height: 44px;
    }

    .people-stepper {
      display: flex;
      align-items: stretch;
      gap: 0.5rem;
      max-width: 100%;
    }
    .btn-step {
      flex: 0 0 var(--touch-min);
      width: var(--touch-min);
      min-height: var(--touch-min);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--app-border);
      border-radius: var(--app-radius-sm);
      background: #fff;
      color: var(--app-primary-dark);
      font-size: 1.25rem;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .btn-step:hover {
      background: var(--app-surface);
      border-color: var(--app-primary);
    }
    .btn-step:active { transform: scale(0.94); }
    .btn-step:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .people-stepper .form-control {
      flex: 1;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      border: 2px solid var(--app-border);
      border-radius: var(--app-radius-sm);
      min-height: var(--touch-min);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .btn-reset {
      width: 100%;
      min-height: 46px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--app-muted);
      border: 2px dashed var(--app-border);
      border-radius: var(--app-radius-sm);
      background: transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .btn-reset:hover {
      color: var(--app-danger);
      border-color: rgba(225, 29, 72, 0.35);
      background: var(--app-danger-bg);
    }

    .results-panel {
      background: linear-gradient(155deg, #0f766e 0%, #0d9488 40%, #14b8a6 100%);
      color: #fff;
      border-radius: var(--app-radius);
      padding: 1.35rem 1.25rem;
      scroll-margin-top: 1rem;
      box-shadow: var(--app-shadow-lg);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .results-panel.is-active {
      box-shadow: 0 24px 48px rgba(13, 148, 136, 0.35);
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .results-header h2 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 0;
      opacity: 0.9;
    }
    .results-header-icon {
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 1.1rem;
    }

    .result-hero {
      text-align: center;
      padding: 1rem 0.75rem 1.15rem;
      margin-bottom: 0.85rem;
      background: rgba(255, 255, 255, 0.12);
      border-radius: var(--app-radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .results-panel.is-active .result-hero {
      opacity: 1;
      transform: translateY(0);
    }
    .result-hero-label {
      font-size: 0.8125rem;
      font-weight: 600;
      opacity: 0.9;
      margin-bottom: 0.25rem;
    }
    .result-hero-value {
      font-size: clamp(1.35rem, 5vw + 0.85rem, 2.25rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1.15;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
      padding: 0 0.25rem;
    }
    .result-hero-value.updated {
      animation: amount-pop 0.35s ease;
    }
    @keyframes amount-pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .result-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .result-chip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.75rem;
      padding: 0.6rem 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.65rem;
      font-size: 0.875rem;
      min-width: 0;
    }
    .result-chip-label {
      opacity: 0.88;
      font-weight: 500;
      flex: 1 1 auto;
      min-width: 5rem;
    }
    .result-chip-value {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex: 0 1 auto;
      text-align: right;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .results-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
      padding: 1.25rem 0.5rem;
      opacity: 0.85;
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .results-placeholder i {
      font-size: 2rem;
      opacity: 0.5;
    }

    .remainder-note {
      font-size: 0.75rem;
      opacity: 0.9;
      margin-top: 0.75rem;
      padding: 0.55rem 0.65rem;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 0.5rem;
      line-height: 1.4;
    }

    .app-footer {
      text-align: center;
      padding: 1rem 0 0.5rem;
      font-size: 0.75rem;
      color: var(--app-muted);
    }

    /* Mobile: sticky results dock + natural page scroll */
    @media (max-width: 575.98px) {
      .app-shell {
        padding-left: max(0.75rem, env(safe-area-inset-left));
        padding-right: max(0.75rem, env(safe-area-inset-right));
      }
      .card-app {
        margin-bottom: 1rem;
        padding: 1rem !important;
      }
      .app-header {
        padding-bottom: 0.85rem;
      }
      main {
        display: block;
        padding-bottom: 0.5rem;
      }
      .results-panel {
        position: sticky;
        bottom: max(0.5rem, env(safe-area-inset-bottom));
        z-index: 20;
      }
    }

    /* Short viewports (e.g. DevTools 360px height) — tighter vertical rhythm */
    @media (max-width: 575.98px) and (max-height: 640px) {
      .header-icon {
        width: 44px;
        height: 44px;
        margin-bottom: 0.5rem;
        font-size: 1.2rem;
      }
      .app-header h1 { font-size: 1.35rem; }
      .app-header p { font-size: 0.85rem; }
      .badge-live { margin-top: 0.4rem; }
      .field-block { margin-bottom: 1rem; }
      .result-hero {
        padding: 0.65rem 0.5rem 0.75rem;
        margin-bottom: 0.6rem;
      }
      .result-hero-value {
        font-size: clamp(1.2rem, 4.5vw + 0.65rem, 1.65rem);
      }
      .results-panel { padding: 1rem; }
    }

    @media (min-width: 576px) {
      .app-shell { padding-top: 1.5rem; }
      .app-header { padding-bottom: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blob bg-blob-1" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-2" aria-hidden="true"></div>
  <div class="bg-blob bg-blob-3" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="app-header">
      <div class="header-icon" aria-hidden="true">
        <i class="bi bi-receipt-cutoff"></i>
      </div>
      <h1>Tip Calculator</h1>
      <p>Split the bill fairly — updates live as you type</p>
      <span class="badge-live">Live totals</span>
    </header>

    <main>
      <form id="calculator-form" novalidate aria-label="Tip calculator">
        <div class="card-app p-3 p-4 mb-0">
          <div class="field-block">
            <label for="bill-amount" class="section-label">
              <i class="bi bi-cash-stack" aria-hidden="true"></i>
              Bill amount (USD)
            </label>
            <div class="input-group input-group-currency">
              <span class="input-group-text" id="currency-label" aria-hidden="true">$</span>
              <input
                type="text"
                inputmode="decimal"
                class="form-control"
                id="bill-amount"
                name="bill"
                autocomplete="off"
                enterkeyhint="next"
                placeholder="0.00"
                aria-describedby="bill-error currency-label"
                aria-invalid="false"
              >
            </div>
            <div id="bill-error" class="invalid-feedback" role="alert" aria-live="polite"></div>
          </div>

          <fieldset class="field-block mb-0">
            <legend class="section-label mb-2">
              <i class="bi bi-heart" aria-hidden="true"></i>
              Tip percentage
            </legend>
            <div class="tip-grid" role="group" aria-label="Tip presets">
              <button type="button" class="btn btn-tip" data-tip="10" aria-pressed="false">10%</button>
              <button type="button" class="btn btn-tip" data-tip="15" aria-pressed="false">15%</button>
              <button type="button" class="btn btn-tip active" data-tip="20" aria-pressed="true">20%</button>
              <button type="button" class="btn btn-tip" id="btn-custom-tip" data-tip="custom" aria-pressed="false">Custom</button>
            </div>
            <div class="tip-custom-wrap" id="custom-tip-wrap" hidden>
              <label for="tip-custom" class="form-label">Your tip %</label>
              <div class="input-group">
                <input
                  type="text"
                  inputmode="decimal"
                  class="form-control"
                  id="tip-custom"
                  name="tipCustom"
                  autocomplete="off"
                  enterkeyhint="next"
                  placeholder="e.g. 18"
                  aria-describedby="tip-error"
                  aria-invalid="false"
                >
                <span class="input-group-text">%</span>
              </div>
            </div>
            <div id="tip-error" class="invalid-feedback" role="alert" aria-live="polite"></div>
          </fieldset>

          <div class="field-block">
            <label for="num-people" class="section-label">
              <i class="bi bi-people" aria-hidden="true"></i>
              Number of people
            </label>
            <div class="people-stepper">
              <button type="button" class="btn btn-step" id="btn-people-minus" aria-label="Decrease number of people">
                <i class="bi bi-dash-lg" aria-hidden="true"></i>
              </button>
              <input
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                class="form-control"
                id="num-people"
                name="people"
                autocomplete="off"
                enterkeyhint="done"
                placeholder="1"
                value="1"
                aria-describedby="people-error"
                aria-invalid="false"
              >
              <button type="button" class="btn btn-step" id="btn-people-plus" aria-label="Increase number of people">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
              </button>
            </div>
            <div id="people-error" class="invalid-feedback" role="alert" aria-live="polite"></div>
          </div>

          <button type="button" class="btn btn-reset" id="btn-reset">
            <i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i>
            Reset calculator
          </button>
        </div>

        <section
          class="results-panel mt-3"
          id="results-panel"
          aria-live="polite"
          aria-atomic="true"
          tabindex="-1"
        >
          <div class="results-header">
            <h2>Your split</h2>
            <span class="results-header-icon" aria-hidden="true"><i class="bi bi-calculator"></i></span>
          </div>

          <div id="results-content">
            <div class="results-placeholder" id="results-placeholder">
              <i class="bi bi-pencil-square" aria-hidden="true"></i>
              <span>Enter a valid bill, tip, and number of people to see amounts.</span>
            </div>

            <div id="results-values" hidden>
              <div class="result-hero">
                <div class="result-hero-label">Each person pays</div>
                <div class="result-hero-value" id="out-per-person">$0.00</div>
              </div>
              <div class="result-details">
                <div class="result-chip">
                  <span class="result-chip-label">Total tip</span>
                  <span class="result-chip-value" id="out-tip">$0.00</span>
                </div>
                <div class="result-chip">
                  <span class="result-chip-label">Grand total</span>
                  <span class="result-chip-value" id="out-grand">$0.00</span>
                </div>
              </div>
              <p class="remainder-note mb-0" id="remainder-note" hidden></p>
            </div>
          </div>
        </section>
      </form>
    </main>

    <footer class="app-footer">All amounts in US dollars ($)</footer>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    (function ($) {
      'use strict';

      var TIP_MAX = 100;
      var BILL_MAX = 999999999.99;
      var DEFAULT_TIP = 20;

      var state = {
        tipMode: 'preset',
        activePreset: DEFAULT_TIP,
        touched: { bill: false, tip: false, people: false }
      };

      var $form = $('#calculator-form');
      var $bill = $('#bill-amount');
      var $tipCustom = $('#tip-custom');
      var $customWrap = $('#custom-tip-wrap');
      var $people = $('#num-people');
      var $btnTips = $('.btn-tip[data-tip]');
      var $resultsPlaceholder = $('#results-placeholder');
      var $resultsValues = $('#results-values');
      var $remainderNote = $('#remainder-note');
      var $resultsPanel = $('#results-panel');
      var $outPerPerson = $('#out-per-person');

      function parseDecimal(str) {
        if (str == null) return NaN;
        var s = String(str).trim().replace(/,/g, '');
        if (s === '' || s === '.' || s === '-' || s === '+') return NaN;
        var n = parseFloat(s);
        return isFinite(n) ? n : NaN;
      }

      function parsePositiveInt(str) {
        if (str == null) return NaN;
        var s = String(str).trim();
        if (s === '' || !/^\d+$/.test(s)) return NaN;
        var n = parseInt(s, 10);
        return isFinite(n) ? n : NaN;
      }

      function isIntermediateBillInput(str) {
        var s = String(str).trim();
        return s === '' || /^\d*\.?\d{0,2}$/.test(s);
      }

      function isIntermediateTipInput(str) {
        var s = String(str).trim();
        return s === '' || /^\d*\.?\d{0,2}$/.test(s);
      }

      function formatMoney(amount) {
        return '$' + amount.toLocaleString('en-US', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function setFieldError($input, $feedback, message, show) {
        var visible = show && message;
        $input.toggleClass('is-invalid', visible);
        $input.attr('aria-invalid', visible ? 'true' : 'false');
        $feedback.text(message || '');
        $feedback.toggleClass('visible', !!visible);
      }

      function shouldShowError(field, isValid, hasContent, forceShow) {
        if (forceShow) return !isValid && hasContent;
        if (!state.touched[field] && !hasContent) return false;
        return !isValid && (hasContent || state.touched[field]);
      }

      function validateBill() {
        var raw = $bill.val();
        var trimmed = String(raw).trim();

        if (trimmed === '') {
          return { valid: false, bill: NaN, message: '', show: false, partial: true };
        }

        if (!isIntermediateBillInput(raw)) {
          return {
            valid: false,
            bill: NaN,
            message: 'Enter a valid positive amount (numbers only).',
            show: true,
            partial: false
          };
        }

        if (/\.$/.test(trimmed) || /^\+?\.$/.test(trimmed)) {
          return { valid: false, bill: NaN, message: '', show: false, partial: true };
        }

        var bill = parseDecimal(raw);
        if (isNaN(bill)) {
          return { valid: false, bill: NaN, message: '', show: false, partial: true };
        }

        if (bill <= 0) {
          return {
            valid: false,
            bill: bill,
            message: 'Bill must be greater than zero.',
            show: shouldShowError('bill', false, true, true)
          };
        }

        if (bill > BILL_MAX) {
          return {
            valid: false,
            bill: bill,
            message: 'Bill is too large (max $' + BILL_MAX.toLocaleString('en-US') + ').',
            show: true
          };
        }

        return { valid: true, bill: bill, message: '', show: false };
      }

      function getTipPercent() {
        if (state.tipMode === 'preset') {
          return state.activePreset;
        }
        return parseDecimal($tipCustom.val());
      }

      function validateTip() {
        if (state.tipMode === 'preset') {
          return { valid: true, tip: state.activePreset, message: '', show: false };
        }

        var raw = $tipCustom.val();
        var trimmed = String(raw).trim();

        if (trimmed === '') {
          return {
            valid: false,
            tip: NaN,
            message: 'Enter a custom tip percentage.',
            show: state.touched.tip
          };
        }

        if (!isIntermediateTipInput(raw)) {
          return {
            valid: false,
            tip: NaN,
            message: 'Enter a valid percentage (0–' + TIP_MAX + ').',
            show: true
          };
        }

        if (/\.$/.test(trimmed)) {
          return { valid: false, tip: NaN, message: '', show: false, partial: true };
        }

        var tip = parseDecimal(raw);
        if (isNaN(tip)) {
          return { valid: false, tip: NaN, message: '', show: false, partial: true };
        }

        if (tip < 0) {
          return {
            valid: false,
            tip: tip,
            message: 'Tip cannot be negative.',
            show: shouldShowError('tip', false, true, true)
          };
        }

        if (tip > TIP_MAX) {
          return {
            valid: false,
            tip: tip,
            message: 'Tip cannot exceed ' + TIP_MAX + '%.',
            show: true
          };
        }

        return { valid: true, tip: tip, message: '', show: false };
      }

      function validatePeople() {
        var raw = $people.val();
        var trimmed = String(raw).trim();

        if (trimmed === '') {
          return {
            valid: false,
            people: NaN,
            message: 'Enter how many people are splitting the bill.',
            show: state.touched.people
          };
        }

        if (!/^\d+$/.test(trimmed)) {
          return {
            valid: false,
            people: NaN,
            message: 'Use a whole number (no decimals).',
            show: true
          };
        }

        var people = parsePositiveInt(raw);
        if (people < 1) {
          return {
            valid: false,
            people: people,
            message: 'At least 1 person is required.',
            show: true
          };
        }

        if (people > 9999) {
          return {
            valid: false,
            people: people,
            message: 'Maximum 9,999 people.',
            show: true
          };
        }

        return { valid: true, people: people, message: '', show: false };
      }

      /**
       * Split grand total (in cents) across n people; first `remainder` pay one extra cent.
       * Guarantees sum(perPerson) === grandTotal exactly.
       */
      function splitAmountCents(totalCents, people) {
        var base = Math.floor(totalCents / people);
        var remainder = totalCents % people;
        var shares = [];
        for (var i = 0; i < people; i++) {
          shares.push((base + (i < remainder ? 1 : 0)) / 100);
        }
        return {
          perPerson: shares[0],
          perPersonMax: shares[remainder > 0 ? remainder - 1 : 0],
          hasUnequalShares: remainder > 0,
          extraCentCount: remainder
        };
      }

      function roundMoney2(n) {
        return Math.round(n * 100) / 100;
      }

      function updateResults(bill, tipPct, people) {
        var tipAmount = roundMoney2(bill * (tipPct / 100));
        var grand = roundMoney2(bill + tipAmount);
        var totalCents = Math.round(grand * 100);
        var split = splitAmountCents(totalCents, people);

        $('#out-tip').text(formatMoney(tipAmount));
        $('#out-grand').text(formatMoney(grand));
        $outPerPerson.text(formatMoney(split.perPerson));
        $outPerPerson.removeClass('updated');
        void $outPerPerson[0].offsetWidth;
        $outPerPerson.addClass('updated');

        if (split.hasUnequalShares && people > 1) {
          $remainderNote
            .text(
              'Exact split: ' + split.extraCentCount + ' of ' + people + ' pay ' +
              formatMoney(split.perPersonMax) + ' (others ' + formatMoney(split.perPerson) + ').'
            )
            .prop('hidden', false);
        } else {
          $remainderNote.prop('hidden', true).text('');
        }
      }

      function showResultsPlaceholder() {
        $resultsPlaceholder.prop('hidden', false);
        $resultsValues.prop('hidden', true);
        $remainderNote.prop('hidden', true);
        $resultsPanel.removeClass('is-active');
      }

      function showResultsValues() {
        $resultsPlaceholder.prop('hidden', true);
        $resultsValues.prop('hidden', false);
        $resultsPanel.addClass('is-active');
      }

      function getPeopleCount() {
        var n = parsePositiveInt($people.val());
        return isNaN(n) ? 1 : n;
      }

      function adjustPeople(delta) {
        var next = Math.max(1, Math.min(9999, getPeopleCount() + delta));
        $people.val(String(next));
        state.touched.people = true;
        recalculate();
      }

      function recalculate() {
        var billResult = validateBill();
        var tipResult = validateTip();
        var peopleResult = validatePeople();

        setFieldError($bill, $('#bill-error'), billResult.message, billResult.show);
        setFieldError($tipCustom, $('#tip-error'), tipResult.message, tipResult.show);
        setFieldError($people, $('#people-error'), peopleResult.message, peopleResult.show);

        var allValid =
          billResult.valid &&
          tipResult.valid &&
          peopleResult.valid;

        var count = parsePositiveInt($people.val());
        $('#btn-people-minus').prop('disabled', !isNaN(count) && count <= 1);
        $('#btn-people-plus').prop('disabled', !isNaN(count) && count >= 9999);

        if (allValid) {
          showResultsValues();
          updateResults(billResult.bill, tipResult.tip, peopleResult.people);
        } else {
          showResultsPlaceholder();
        }
      }

      function setTipPreset(percent) {
        state.tipMode = 'preset';
        state.activePreset = percent;
        $btnTips.removeClass('active').attr('aria-pressed', 'false');
        $btnTips.filter('[data-tip="' + percent + '"]').addClass('active').attr('aria-pressed', 'true');
        $customWrap.prop('hidden', true);
        $tipCustom.val('');
        setFieldError($tipCustom, $('#tip-error'), '', false);
        recalculate();
      }

      function setTipCustomMode() {
        state.tipMode = 'custom';
        $btnTips.removeClass('active').attr('aria-pressed', 'false');
        $('#btn-custom-tip').addClass('active').attr('aria-pressed', 'true');
        $customWrap.prop('hidden', false);
        recalculate();
        setTimeout(function () { $tipCustom.trigger('focus'); }, 0);
      }

      function resetApp() {
        state.tipMode = 'preset';
        state.activePreset = DEFAULT_TIP;
        state.touched = { bill: false, tip: false, people: false };

        $bill.val('').removeClass('is-invalid').attr('aria-invalid', 'false');
        $tipCustom.val('').removeClass('is-invalid').attr('aria-invalid', 'false');
        $people.val('1').removeClass('is-invalid').attr('aria-invalid', 'false');

        $('#bill-error, #tip-error, #people-error').text('').removeClass('visible');
        $customWrap.prop('hidden', true);

        $btnTips.removeClass('active').attr('aria-pressed', 'false');
        $btnTips.filter('[data-tip="' + DEFAULT_TIP + '"]').addClass('active').attr('aria-pressed', 'true');

        showResultsPlaceholder();
        $bill.trigger('focus');
        recalculate();
      }

      $btnTips.filter('[data-tip="10"], [data-tip="15"], [data-tip="20"]').on('click', function () {
        setTipPreset(parseInt($(this).data('tip'), 10));
      });

      $('#btn-custom-tip').on('click', function () {
        setTipCustomMode();
      });

      $bill.on('input', function () {
        recalculate();
      });

      $bill.on('blur', function () {
        state.touched.bill = true;
        recalculate();
      });

      $tipCustom.on('input', function () {
        recalculate();
      });

      $tipCustom.on('blur', function () {
        state.touched.tip = true;
        recalculate();
      });

      $people.on('input', function () {
        recalculate();
      });

      $people.on('blur', function () {
        state.touched.people = true;
        recalculate();
      });

      $('#btn-reset').on('click', resetApp);

      $('#btn-people-minus').on('click', function () {
        adjustPeople(-1);
      });

      $('#btn-people-plus').on('click', function () {
        adjustPeople(1);
      });

      $outPerPerson.on('animationend', function () {
        $(this).removeClass('updated');
      });

      $form.on('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          var $focus = $(document.activeElement);
          if ($focus.is('#bill-amount')) {
            if (state.tipMode === 'custom') {
              $tipCustom.trigger('focus');
            } else {
              $people.trigger('focus');
            }
          } else if ($focus.is('#tip-custom')) {
            $people.trigger('focus');
          } else if ($focus.is('#num-people')) {
            $('#results-panel').trigger('focus');
          }
        }
      });

      $bill.on('paste', function () {
        setTimeout(recalculate, 0);
      });

      $tipCustom.on('paste', function () {
        setTimeout(recalculate, 0);
      });

      $people.on('paste', function (e) {
        var pasted = (e.originalEvent.clipboardData || window.clipboardData).getData('text');
        if (!/^\d+$/.test(String(pasted).trim())) {
          e.preventDefault();
          state.touched.people = true;
          setFieldError($people, $('#people-error'), 'Use a whole number (no decimals).', true);
        } else {
          setTimeout(recalculate, 0);
        }
      });

      recalculate();
      $bill.trigger('focus');
    })(jQuery);
  </script>
</body>
</html>
